name = "Jucy Light"

[colors]
"ComboBox::backgroundColourId"             = "#FFF96E00"  # Orange accent for inactive selection and other backgrounds
"Label::textColourId"                      = "#FF212121"  # Dark charcoal, not pure black
"ListBox::backgroundColourId"              = "#FFFFFFFF"
"ListBox::outlineColourId"                 = "#FFC7C7CC"  # Subtle border for lists/tables
"ListBox::selectedBackgroundColourId"      = "#FFF96E00"
"ListBox::textColourId"                    = "#FF212121"
"PopupMenu::backgroundColourId"            = "#FFF0F0F0"  # Very light gray for menu background
"PopupMenu::highlightedBackgroundColourId" = "#FFF96E00"  # Orange accent for menu hover and selected backgrounds
"PopupMenu::textColourId"                 = "#FF212121"  # Dark text for menu items
"PopupMenu::highlightedTextColourId"       = "#FFFFFFFF"  # White text for selected items in menus, listboxes, treeviews
"TextButton::textColourOffId"             = "#FF212121"  # Dark text for buttons in "off" state
"TextButton::textColourOnId"              = "#FFFFFFFF"  # White text for buttons in "on" (orange) state
"ResizableWindow::backgroundColourId"      = "#FFF8F8F8"
"Slider::thumbColourId"                    = "#FFF96E00"
"Slider::trackColourId"                    = "#FFD1D1D6"
"ScrollBar::thumbColourId"                 = "#FFF96E00"  # Orange accent for scrollbar thumb
"ScrollBar::trackColourId"                 = "#FFF96E00"  # Orange accent for scrollbar track
"TextButton::buttonColourId"               = "#FFEFEFF4"  # A very light button background
"TextButton::buttonOnColourId"             = "#FFF96E00"
"TextEditor::backgroundColourId"           = "#FFFFFFFF"
"TextEditor::outlineColourId"              = "#FFC7C7CC"
"TreeView::backgroundColourId"             = "#FFFFFFFF"  # Pure white panels for content clarity
"TreeView::dragAndDropIndicatorColourId"   = "#FFF96E00"
"TreeView::evenItemsColourId"              = "#FFF8F8F8"  # Subtle alternating row color
"TreeView::linesColourId"                  = "#FFD1D1D6"
"TreeView::oddItemsColourId"               = "#00000000"
"TreeView::selectedItemBackgroundColourId" = "#FFF96E00"
