name = "Solarized Light"

[colors]
"Label::textWhenEditingColourId"           = "#FF657b83"  # Base00 text when editing
"Label::backgroundWhenEditingColourId"     = "#FFeee8d5"  # Base2 background when editing
"ListBox::outlineColourId"                 = "#FF93a1a1"  # Base1 border
"TabbedComponent::outlineColourId"         = "#FF93a1a1"
"TabbedButtonBar::tabOutlineColourId"      = "#FF93a1a1"
"Slider::trackColourId"                    = "#FF93a1a1"
"Slider::textBoxOutlineColourId"           = "#FF93a1a1"
"ScrollBar::trackColourId"                 = "#FFeee8d5"
"TextButton::buttonColourId"               = "#FFeee8d5"
"TextEditor::outlineColourId"              = "#FF93a1a1"
"TreeView::linesColourId"                  = "#FF93a1a1"
"waveformColourId"                         = "#FF268bd2"  # Blue waveform
"accent"                                   = "#FF268bd2"  # Solarized Blue accent
"mainBackground"                           = "#FFfdf6e3"  # Base3 - cream background
"alternateBackground"                      = "#FFeee8d5"  # Base2 - alternate rows
"mainForeground"                           = "#FF657b83"  # Base00 - main text
"disabledForeground"                       = "#FF93a1a1"  # Base1 - disabled text
