name = "Jucy Dark"

[colors]
"Label::textColourId"                      = "#FFabb2bf"  # Main text color (soft off-white)
"Label::textWhenEditingColourId"           = "#FFE0E0E0"  # Light text when editing labels/sliders
"Label::backgroundWhenEditingColourId"     = "#FF282c34"  # Dark background when editing
"ListBox::backgroundColourId"              = "#FF1e1e1e"  # Dark gray background, no blue tint
"ListBox::outlineColourId"                 = "#FF3e4451"  # Subtle border for lists/tables
"ListBox::textColourId"                    = "#FFabb2bf"
"PopupMenu::backgroundColourId"            = "#FF21252b"
"PopupMenu::textColourId"                  = "#FFabb2bf"  # Normal text color for menu items
"PopupMenu::highlightedTextColourId"       = "#FFFFFFFF"  # White text for selected items
"ResizableWindow::backgroundColourId"      = "#FF1e1e1e"  # Dark gray main window, no blue tint
"TabbedComponent::backgroundColourId"      = "#FF1e1e1e"  # Same as window background
"TabbedComponent::outlineColourId"         = "#FF3e4451"  # Subtle border
"TabbedButtonBar::tabOutlineColourId"      = "#FF3e4451"  # Tab borders
"TabbedButtonBar::tabTextColourId"         = "#FFabb2bf"  # Light text for inactive tabs
"TabbedButtonBar::frontTextColourId"       = "#FFFFFFFF"  # White text for active tab
"Slider::trackColourId"                    = "#FF3e4451"
"Slider::textBoxTextColourId"              = "#FFE0E0E0"  # Light text for slider text boxes
"Slider::textBoxBackgroundColourId"        = "#FF282c34"  # Dark background for slider text boxes
"Slider::textBoxOutlineColourId"           = "#FF3e4451"  # Dark border for slider text boxes
"ScrollBar::trackColourId"                 = "#FF3e4451"  # Dark gray for scrollbar track
"TextButton::buttonColourId"               = "#FF3e4451"  # "Off" state for buttons
"TextButton::textColourOffId"              = "#FFabb2bf"  # Normal text color for buttons in "off" state
"TextButton::textColourOnId"               = "#FFFFFFFF"  # White text for buttons in "on" state
"TextEditor::backgroundColourId"           = "#FF282c34"
"TextEditor::outlineColourId"              = "#FF3e4451"
"TextEditor::textColourId"                 = "#FFE0E0E0"  # Light gray text for editors
"ToggleButton::textColourId"               = "#FFabb2bf"  # Normal text color for checkboxes
"TreeView::backgroundColourId"             = "#FF1e1e1e"  # Dark gray panels, no blue tint
"TreeView::evenItemsColourId"              = "#FF242424"  # Subtle alternating row color
"TreeView::linesColourId"                  = "#FF3e4451"  # The indent lines
"TreeView::oddItemsColourId"               = "#00000000"  # Transparent - use main background
"ProgressBar::backgroundColourId"        = "#FF3e4451"  # Dark gray background for progress bar
"waveformColourId"                         = "#FFE0E0E0"  # Light gray/white waveform for dark theme
"folderOnlineTextColourId"                 = "#FFabb2bf"  # Normal text color for online folders
"folderOfflineTextColourId"                = "#FF5C5E66"  # Dimmed gray for offline folders
"accentColourId"                           = "#FFFF4444"  # Red accent for icons in dark theme
