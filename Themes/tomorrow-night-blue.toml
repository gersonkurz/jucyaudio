name = "Tomorrow Night Blue"

[colors]
"Label::textWhenEditingColourId"           = "#FFFFFFFF"  # White text when editing
"Label::backgroundWhenEditingColourId"     = "#FF00346e"  # Lighter blue background when editing
"ListBox::outlineColourId"                 = "#FF003f8e"  # Blue border for lists/tables
"TabbedComponent::outlineColourId"         = "#FF003f8e"  # Blue border
"TabbedButtonBar::tabOutlineColourId"      = "#FF003f8e"  # Tab borders
"Slider::trackColourId"                    = "#FF003f8e"
"Slider::textBoxOutlineColourId"           = "#FF003f8e"  # Blue border for slider text boxes
"ScrollBar::trackColourId"                 = "#FF003f8e"  # Blue for scrollbar track
"TextButton::buttonColourId"               = "#FF003f8e"  # "Off" state for buttons
"TextEditor::outlineColourId"              = "#FF003f8e"
"TreeView::linesColourId"                  = "#FF003f8e"  # The indent lines
"waveformColourId"                         = "#FF99ffff"  # Cyan waveform
"accent"                                   = "#FF99ffff"  # Cyan accent for icons
"mainBackground"                           = "#FF002451"  # Tomorrow Night Blue background
"alternateBackground"                      = "#FF00346e"  # Slightly lighter blue
"mainForeground"                           = "#FFFFFFFF"  # White
"disabledForeground"                       = "#FF7285b7"  # Muted blue-gray (comment color)
